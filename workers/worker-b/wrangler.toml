name = "worker-b-db"
main = "worker-b.js"
compatibility_date = "2026-07-10"
compatibility_flags = ["nodejs_compat"]

# Do not put sensitive secrets in [vars].
# Configure INTERNAL_AUTH_TOKEN using Cloudflare Secrets:
#   wrangler secret put INTERNAL_AUTH_TOKEN
[vars]
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "zeus-db"
database_id = "<YOUR_D1_DATABASE_ID>"

[triggers]
crons = ["0 * * * *"] # Hourly auto-reset check
