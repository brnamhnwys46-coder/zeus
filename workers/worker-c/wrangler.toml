name = "worker-c-cache"
main = "worker-c.js"
compatibility_date = "2026-07-10"
compatibility_flags = ["nodejs_compat"]

# Do not put sensitive secrets in [vars].
# Configure INTERNAL_AUTH_TOKEN using Cloudflare Secrets:
#   wrangler secret put INTERNAL_AUTH_TOKEN
[vars]
ENVIRONMENT = "production"
UPSTREAM_MIRRORS = "https://raw.githubusercontent.com/panel-zeus/Z-E-U-S/refs/heads/main"

[[kv_namespaces]]
binding = "FILE_CACHE_KV"
id = "<YOUR_KV_NAMESPACE_ID>"
